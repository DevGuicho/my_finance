name: my_finance

services:
  db:
    image: postgres:17
    container_name: my_finance_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: my_finance
      POSTGRES_PASSWORD: my_finance_password
      POSTGRES_DB: my_finance_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    labels:
      - dev.orbstack.domains=db.my_finance.local,postgres.my_finance.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_finance -d my_finance_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: